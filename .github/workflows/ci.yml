name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install and test web
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Install and test api
        working-directory: apps/api
        run: |
          npm ci
          npm run lint
          npm test
